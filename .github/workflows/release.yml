name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux Portable
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller prenotazioni.spec --clean
          mkdir -p release_linux
          cp dist/prenotazioni release_linux/
          chmod +x release_linux/prenotazioni
          tar -czvf prenotazioni-linux-x86_64.tar.gz -C release_linux prenotazioni

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-binary
          path: prenotazioni-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows Portable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller prenotazioni.spec --clean
          Compress-Archive -Path dist/prenotazioni.exe -DestinationPath prenotazioni-windows-x86_64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-binary
          path: prenotazioni-windows-x86_64.zip

  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download Linux artifact
        uses: actions/download-artifact@v6
        with:
          name: linux-binary

      - name: Download Windows artifact
        uses: actions/download-artifact@v6
        with:
          name: windows-binary

      - name: Extract Changelog for Release
        run: |
          python -c '
          import os, re
          tag = os.environ.get("GITHUB_REF_NAME", "")
          with open("CHANGELOG.md", "r", encoding="utf-8") as f:
              content = f.read()
          tag_escaped = re.escape(tag)
          pattern = rf"(## {tag_escaped}[\s\S]*?)(?=\n## |\Z)"
          match = re.search(pattern, content)
          if match:
              body = match.group(1).strip()
          else:
              body = f"Release {tag}"
          with open("RELEASE_NOTES.md", "w", encoding="utf-8") as f_out:
              f_out.write(body + "\n")
          '

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            prenotazioni-linux-x86_64.tar.gz
            prenotazioni-windows-x86_64.zip
          draft: false
          prerelease: false
          generate_release_notes: false

