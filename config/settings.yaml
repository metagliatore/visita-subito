# =====================================================
# Configurazione globale — pigramente letta con PyYAML
# =====================================================
auth:
  # Metodo di autenticazione: "spid" | "cie" | "manual"
  method: "spid"

  spid:
    # Provider SPID supportati:
    # "sielte" (automatizzato con push/OTP), "poste", "aruba", "infocert",
    # "lepida", "namirial", "tim", "register", "etna", "infocamere", "intesigroup"
    provider: "sielte"
    otp_mode: "notifica"  # "notifica" (push app) oppure "otp" (SMS/app)

  cie:
    # Modalità CIE:
    #   - "app": App CieID con credenziali Livello 2 (CF/CIE + password) o QR Code a schermo
    #   - "qr": Accesso diretto tramite QR Code inviato su Telegram da inquadrare con app CieID
    #   - "smartcard": Livello 3 (richiede lettore NFC e smartcard fisica)
    mode: "app"
    # Credenziali Livello 2 (opzionali in settings.yaml o via CIE_USERNAME / CIE_PASSWORD in .env):
    # username: ""  # Codice Fiscale o Numero CIE (es. CA00000AA)
    # password: ""  # Password delle credenziali CIE

browser:
  # Percorso del binario Chrome. Vuoto => usa lo Selenium Manager default.
  # In dev puoi indicare il path o impostare CHROME_BIN in .env; in Docker usa il default di sistema.
  binary_path: ""
  headless: true            # false => finestra visibile; true per Docker/produzione
  window_size: [1280, 900]

session:
  # Intervallo (secondi) tra richieste di keep-alive per tenere viva la sessione.
  keep_alive_seconds: 900          # 15 min
  # Prima dello scadere dei cookie, notifica che serve re-login.
  relogin_warn_before_seconds: 3600
  # Dove salvare i cookie/sessione
  cookie_files: "data/cookies"
  # Durata massima ritenuta "fresca" della sessione senza usarla (sentinella)
  max_idle_seconds: 21600          # 6 ore

scheduler:
  # Intervallo di polling dei flussi
  poll_interval_seconds: 300       # 5 min
  # Timeout massimo (sec) per caricamento lista appuntamenti in riprogrammazione
  reschedule_wait_timeout: 30
  # Giorni lavorativi minimi di preavviso per riprogrammare una visita esistente
  # (esclusi sabato, domenica e festivi nazionali). Se mancano meno di X giorni lavorativi,
  # il monitor viene arrestato automaticamente per evitare l'addebito del malus ticket.
  # Impostare a 0 per disattivare il controllo.
  reschedule_min_working_days: 3
  # Fast-Track Auto-Booking ("Sniper mode"): prenota subito lo slot senza attendere l'approvazione manuale.
  # Ideale per disponibilità critiche che spariscono in pochi secondi. Impostare a true per attivare.
  # Default: false (disattivato per prudenza).
  auto_book: false
  # Giorni minimi di anticipo rispetto ad oggi per cui l'auto-booking immediato è consentito.
  # Serve a tutelarsi da possibili appuntamenti scomodi che poi non potrebbero essere più spostati o
  # disdetti senza pagare una sanzione economica (regola dei 3 giorni lavorativi / malus ticket).
  # Se lo slot trovato dista meno di X giorni, il bot passa automaticamente alla richiesta manuale.
  auto_book_min_days: 5
  # Strategia di ricerca multi-provincia: "first_match" | "best_match"
  # - "first_match" (consigliata / rapida): carica una provincia alla volta;
  #   non appena trova una disponibilità valida nei criteri, si ferma, la propone
  #   all'utente e attende con il browser fermo sulla schermata. All'approvazione,
  #   prenota all'istante senza dover cambiare provincia, minimizzando le race condition.
  # - "best_match" (globale): scansiona TUTTE le province configurate, raccoglie
  #   tutti gli slot e propone la data più vicina in assoluto. Comporta il rischio che,
  #   nel tempo impiegato per esaminare le altre province e tornare indietro, lo slot
  #   sia già stato occupato da altri.
  search_strategy: "first_match"

commute:
  # Calcolo distanza da casa e tempi di percorrenza (auto e trasporto pubblico)
  # Imposta le coordinate della tua abitazione (es. "45.4642, 9.1900")
  # Se vuoto, il calcolo della distanza è disattivato.
  home_coordinates: ""

telegram:
  # Token del bot creato con @BotFather
  token: ""  # leggi da .env (TG_TOKEN)
  # Chat ID della persona che riceve le notifiche (numerico, con - per i gruppi)
  chat_id: ""  # leggi da .env (TG_CHAT_ID)
  # Chat ID secondario opzionale (es. gruppo di backup)
  chat_id_secondary: ""

logging:
  level: "INFO"           # DEBUG per lo studio dei selettori
  file: "data/app.log"

approval:
  # Timeout (sec) entro cui l'utente deve confermare su Telegram
  timeout_seconds: 600
  # Se true, dopo il timeout la richiesta viene scartata
  discard_on_timeout: true

debug:
  # Cartella dove salvare screenshot e dump HTML in caso di errore (sovrascrivibile da DEBUG_DUMP_DIR in .env)
  dump_dir: "data/debug"

app:
  # Verifica automatica nuove release su GitHub all'avvio (sovrascrivibile con CHECK_UPDATES in .env)
  check_updates: true
  # Invia messaggio di benvenuto con stato versione su Telegram all'avvio (sovrascrivibile con TG_STARTUP_NOTIFICATION in .env)
  tg_startup_notification: true


