stages:
  - test
  - build
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# -------------------------------------------------------------
# Stage: Test (Pytest automatico su Python 3.11)
# -------------------------------------------------------------
test:
  stage: test
  image: python:3.11-slim
  cache:
    paths:
      - .cache/pip
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt pytest
  script:
    - pytest tests/ -v --no-cov
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# -------------------------------------------------------------
# Stage: Build Linux (Binario standalone ELF x86_64)
# -------------------------------------------------------------
build:linux:
  stage: build
  image: python:3.11-slim
  cache:
    paths:
      - .cache/pip
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends binutils tar gzip
    - pip install --upgrade pip
    - pip install -r requirements.txt pyinstaller
  script:
    - pyinstaller prenotazioni.spec --clean
    - mkdir -p release_linux
    - cp dist/prenotazioni release_linux/
    - chmod +x release_linux/prenotazioni
    - tar -czvf prenotazioni-linux-x86_64.tar.gz -C release_linux prenotazioni
  artifacts:
    paths:
      - prenotazioni-linux-x86_64.tar.gz
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# -------------------------------------------------------------
# Stage: Build Windows (Eseguibile standalone .exe x86_64)
# -------------------------------------------------------------
build:windows:
  stage: build
  tags:
    - saas-windows-medium-amd64 # Oppure il tag del runner Windows self-hosted
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt pyinstaller
  script:
    - pyinstaller prenotazioni.spec --clean
    - Compress-Archive -Path dist/prenotazioni.exe -DestinationPath prenotazioni-windows-x86_64.zip
  artifacts:
    paths:
      - prenotazioni-windows-x86_64.zip
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# -------------------------------------------------------------
# Stage: Release (Pubblicazione automatica dei binari su tag)
# -------------------------------------------------------------
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build:linux
      artifacts: true
    - job: build:windows
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  before_script:
    - apk add --no-cache curl
  script:
    - |
      PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/prenotazioni/${CI_COMMIT_TAG}"
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file prenotazioni-linux-x86_64.tar.gz "${PACKAGE_URL}/prenotazioni-linux-x86_64.tar.gz"
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file prenotazioni-windows-x86_64.zip "${PACKAGE_URL}/prenotazioni-windows-x86_64.zip"
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: |
      ## Prenotazioni Fascicolo Sanitario - Portable Release $CI_COMMIT_TAG

      ### Pacchetti Standalone Portatili (Nessuna installazione o diritti di admin richiesti):
      - **Windows (x86_64)**: `prenotazioni-windows-x86_64.zip` (estrai ed esegui `prenotazioni.exe`)
      - **Linux (x86_64)**: `prenotazioni-linux-x86_64.tar.gz` (estrai ed esegui `./prenotazioni`)

      Al primo avvio, se il file `.env` non è presente, si aprirà automaticamente il wizard guidato.
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_TAG'
    assets:
      links:
        - name: 'prenotazioni-windows-x86_64.zip'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/prenotazioni/${CI_COMMIT_TAG}/prenotazioni-windows-x86_64.zip'
        - name: 'prenotazioni-linux-x86_64.tar.gz'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/prenotazioni/${CI_COMMIT_TAG}/prenotazioni-linux-x86_64.tar.gz'
