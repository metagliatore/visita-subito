services:
  monitor:
    build: .
    container_name: fascicolo-monitor
    init: true
    env_file:
      - .env
    environment:
      - CHROME_BIN=/usr/bin/google-chrome
      - PYTHONUNBUFFERED=1
    shm_size: "2gb"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    restart: unless-stopped
